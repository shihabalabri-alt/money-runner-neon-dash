<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Turbo Racer — Neon Highway</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="logo">TURBO <span>RACER</span></div>
    <div class="stats">
      <div class="stat"><small>SCORE</small><b id="score">0</b></div>
      <div class="stat"><small>COINS</small><b id="coins">0</b></div>
      <div class="stat"><small>BEST</small><b id="best">0</b></div>
    </div>
    <div class="actions">
      <button id="muteBtn" class="icon-btn">🔊</button>
      <button id="fsBtn" class="icon-btn">⛶</button>
    </div>
  </header>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1 id="ovTitle">TURBO RACER</h1>
      <p id="ovSub">◀ ▶ / A D / drag to steer. Dodge traffic. Grab coins.<br>Survive longer = faster.</p>
      <button class="btn big" id="playBtn">▶ DRIVE</button>
      <p class="hint">P = pause • M = mute</p>
    </div>
  </div>
  <div id="controls">
    <button class="btn ghost big-touch" id="leftBtn">◀</button>
    <button class="btn ghost big-touch" id="rightBtn">▶</button>
  </div>
</div>
<script src="game.js?v=3"></script>
</body>
</html>
